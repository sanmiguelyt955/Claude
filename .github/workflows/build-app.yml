# Construye los instaladores de la app de escritorio (Mac y Windows) y publica una
# versión nueva en Releases. La app instalada detecta esa versión y se actualiza sola.
name: Construir app de escritorio

on:
  workflow_dispatch:
  push:
    branches: [video-editor-app]
    paths:
      - 'video-editor-app/**'
      - '.github/workflows/build-app.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: editor-de-video-mac
          - os: windows-latest
            script: dist:win
            artifact: editor-de-video-windows
    defaults:
      run:
        working-directory: video-editor-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video-editor-app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Usar el FFmpeg incluido en la app
        # Las pruebas y la app usan el mismo binario (ffmpeg-static, con drawtext).
        shell: bash
        run: |
          echo "$(node -p "require('path').resolve(require('path').dirname(require('ffmpeg-static')))")" >> "$GITHUB_PATH"
          echo "$(node -p "require('path').resolve(require('path').dirname(require('ffprobe-static').path))")" >> "$GITHUB_PATH"

      - name: Probar el motor
        shell: bash
        run: |
          ffmpeg -hide_banner -filters | grep -q drawtext && echo "drawtext OK"
          npm test

      - name: Número de versión
        # 1.0.<número de ejecución>: cada construcción es más nueva que la anterior.
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Generar instalador
        run: npm run ${{ matrix.script }}

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            video-editor-app/release/*.dmg
            video-editor-app/release/*.exe
            video-editor-app/release/*.blockmap
            video-editor-app/release/latest*.yml
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar versión
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Crear versión en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Editor de video 1.0.${{ github.run_number }}
          body: Versión generada automáticamente. La app instalada se actualiza sola a partir de esta versión.
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
