<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Buscar notas">
<title>Buscar notas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --texto: #1d1d1f; --suave: #6e6e73;
    --acento: #7c3aed; --borde: #d2d2d7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --card: #1c1c1e; --texto: #f5f5f7; --suave: #98989d;
      --acento: #a78bfa; --borde: #38383a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --card: #1c1c1e; --texto: #f5f5f7; --suave: #98989d;
    --acento: #a78bfa; --borde: #38383a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    min-height: 100vh;
  }
  header { padding: 16px 0 8px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  input[type="search"] {
    width: 100%; font-size: 17px; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--borde); background: var(--card); color: var(--texto);
    -webkit-appearance: none;
  }
  input[type="search"]:focus { outline: 2px solid var(--acento); outline-offset: 0; }
  .estado { color: var(--suave); font-size: 14px; margin: 10px 2px; }
  .nota {
    background: var(--card); border: 1px solid var(--borde); border-radius: 14px;
    padding: 14px; margin: 10px 0;
  }
  .nota h2 { font-size: 17px; margin: 0 0 4px; }
  .ruta { font-size: 12px; color: var(--suave); word-break: break-all; margin-bottom: 6px; }
  .frag { font-size: 15px; line-height: 1.4; }
  mark { background: #fde68a; color: #1d1d1f; border-radius: 3px; padding: 0 2px; }
  .vacio { text-align: center; color: var(--suave); padding: 40px 0; }
  .aviso { font-size: 13px; color: var(--suave); margin: 24px 0; line-height: 1.4; }
</style>
</head>
<body>
<header>
  <h1>Buscar notas</h1>
  <input id="q" type="search" placeholder="Buscar en mis notas…" autocomplete="off" autocapitalize="none" enterkeyhint="search">
  <div class="estado" id="estado">Cargando notas…</div>
</header>
<main id="resultados"></main>
<p class="aviso">Prueba local: el buscador usa un índice guardado en esta app (data/notas.json), sin conexión a Obsidian 2.0 en vivo.</p>

<script>
(function () {
  var notas = [];
  var q = document.getElementById('q');
  var estado = document.getElementById('estado');
  var resultados = document.getElementById('resultados');

  function escapar(t) {
    return t.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Devuelve un fragmento alrededor de la primera coincidencia, con la palabra resaltada.
  function fragmento(texto, termino) {
    var i = texto.toLowerCase().indexOf(termino.toLowerCase());
    var ini = Math.max(0, i < 0 ? 0 : i - 60);
    var fin = Math.min(texto.length, (i < 0 ? 0 : i) + termino.length + 100);
    var corte = texto.slice(ini, fin);
    var html = escapar(corte);
    if (i >= 0) {
      var re = new RegExp(termino.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      html = html.replace(re, function (m) { return '<mark>' + m + '</mark>'; });
    }
    return (ini > 0 ? '… ' : '') + html + (fin < texto.length ? ' …' : '');
  }

  function buscar() {
    var termino = q.value.trim();
    resultados.innerHTML = '';
    if (!termino) { estado.textContent = notas.length + ' notas en el índice'; return; }
    var palabras = termino.toLowerCase().split(/\s+/);
    var encontradas = notas.filter(function (n) {
      var todo = (n.titulo + ' ' + n.texto).toLowerCase();
      return palabras.every(function (p) { return todo.indexOf(p) !== -1; });
    });
    estado.textContent = encontradas.length + ' resultado(s)';
    if (!encontradas.length) {
      resultados.innerHTML = '<div class="vacio">Sin resultados para “' + escapar(termino) + '”</div>';
      return;
    }
    resultados.innerHTML = encontradas.map(function (n) {
      return '<article class="nota"><h2>' + escapar(n.titulo) + '</h2>' +
             '<div class="ruta">' + escapar(n.ruta) + '</div>' +
             '<div class="frag">' + fragmento(n.texto, palabras[0]) + '</div></article>';
    }).join('');
  }

  q.addEventListener('input', buscar);

  fetch('data/notas.json')
    .then(function (r) { return r.json(); })
    .then(function (datos) { notas = datos; buscar(); })
    .catch(function () { estado.textContent = 'No se pudo cargar el índice de notas.'; });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
