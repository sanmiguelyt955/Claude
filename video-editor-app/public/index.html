<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor de video</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <strong>Editor de video</strong>
    <span id="status" class="status"></span>
    <button id="exportBtn" class="primary">Exportar MP4</button>
  </header>

  <main class="layout">
    <aside class="panel bin">
      <h2>Biblioteca</h2>
      <label class="upload">
        <input id="fileInput" type="file" accept="video/*" multiple hidden>
        <span>+ Importar videos</span>
      </label>
      <ul id="mediaList" class="list"></ul>
    </aside>

    <section class="panel preview">
      <video id="video" playsinline></video>
      <div class="transport">
        <button id="playBtn">▶ Reproducir</button>
        <span id="timecode">00:00.0 / 00:00.0</span>
      </div>
      <input id="playhead" type="range" min="0" max="0" step="0.01" value="0">
      <div class="row">
        <button id="splitBtn">✂ Cortar en el cursor</button>
      </div>
    </section>

    <section class="panel inspector">
      <h2>Clip seleccionado</h2>
      <div id="clipInfo" class="muted">Selecciona un clip en la línea de tiempo.</div>
      <div id="clipControls" hidden>
        <label>Inicio (s) <input id="clipStart" type="number" step="0.1" min="0"></label>
        <label>Fin (s) <input id="clipEnd" type="number" step="0.1" min="0"></label>
        <div class="row">
          <button id="moveLeft">← Mover</button>
          <button id="moveRight">Mover →</button>
          <button id="deleteClip" class="danger">Quitar</button>
        </div>
      </div>

      <h2>Textos</h2>
      <div class="row">
        <input id="textInput" type="text" placeholder="Escribe un texto">
        <button id="addText">Añadir</button>
      </div>
      <ul id="textList" class="list"></ul>
    </section>

    <section class="panel timeline">
      <div id="tracks" class="tracks"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
