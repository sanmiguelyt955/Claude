# Render Blueprint: defines the hosted services for this repo.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gcp-analysis
    runtime: docker
    rootDir: gcp-analysis
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    # Render injects PORT; the Dockerfile reads it.
    autoDeploy: true
  - type: web
    name: eco-player
    runtime: node
    rootDir: eco-player
    buildCommand: "true"
    startCommand: node server.js
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SC_CLIENT_ID
        sync: false
      - key: SC_CLIENT_SECRET
        sync: false
      # URL pública del servicio, p. ej. https://eco-player.onrender.com
      - key: PUBLIC_URL
        sync: false
