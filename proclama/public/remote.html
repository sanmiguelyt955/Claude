<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151c">
<title>Proclama · Control remoto</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --bg: #0d1016; --panel: #151a23; --line: #283040; --text: #eaeef6; --muted: #8e9ab0; --accent: #5b9dff; --live: #f2495c; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 16px/1.35 system-ui, "Segoe UI", Roboto, Arial, sans-serif; display: flex; flex-direction: column; height: 100dvh; }
  button, input { font: inherit; color: inherit; }
  button { background: #222938; border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.on { background: var(--live); border-color: var(--live); font-weight: 700; }
  input { background: #0f1218; border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; flex: 1; }
  header { padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #now { white-space: pre-wrap; min-height: 4.2em; max-height: 9em; overflow: auto; margin-top: 6px; font-size: 18px; }
  #now.off { opacity: .4; }
  main { flex: 1; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 4px 2px 0; }
  .row { display: flex; gap: 8px; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item { text-align: left; white-space: pre-wrap; padding: 10px 12px; font-size: 15px; }
  .item.active { border-color: var(--live); background: #3a1820; }
  .item small { color: var(--muted); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  footer { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); }
  footer button { font-size: 19px; padding: 22px 8px; font-weight: 700; }
  #next { background: var(--accent); border-color: var(--accent); color: #06142e; }
  .tg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tg button { padding: 12px 2px; font-size: 13.5px; }
  #msg { color: var(--muted); font-size: 13px; min-height: 1.2em; }
</style>
</head>
<body>
<header><div id="title">Conectando…</div><div id="now"></div></header>
<main>
  <div class="tg">
    <button id="black">Negro</button><button id="clear">Ocultar texto</button><button id="logo">Logo</button><button id="close">Quitar</button>
  </div>
  <h2>Proyectar una cita bíblica</h2>
  <div class="row"><input id="ref" placeholder="Ej.: Juan 3:16" aria-label="Cita bíblica" enterkeyhint="go"><button id="goRef">Proyectar</button></div>
  <h2>Alerta en pantalla</h2>
  <div class="row"><input id="alert" placeholder="Ej.: Mover el auto placas ABC-123" aria-label="Alerta" enterkeyhint="send"><button id="goAlert">Mostrar</button></div>
  <div id="msg" role="status"></div>
  <h2>Diapositivas</h2><div id="slides" class="list"></div>
  <h2>Programa</h2><div id="sched" class="list"></div>
  <h2>Canciones</h2><div class="row"><input id="q" type="search" placeholder="Buscar canción…" aria-label="Buscar canción"></div><div id="songs" class="list"></div>
</main>
<footer><button id="prev" aria-label="Anterior">◀ Anterior</button><button id="next">Siguiente ▶</button></footer>
<script type="module">
import { createStore } from './js/store.js';
import { resolveItem, itemInfo } from './js/resolve.js';
import { norm } from './shared/model.js';
import { parseReference, bibleToPresentation } from './shared/bible.js';
const $ = (id) => document.getElementById(id);
const store = await createStore('remote');
const say = (t) => { $('msg').textContent = t; setTimeout(() => { if ($('msg').textContent === t) $('msg').textContent = ''; }, 3000); };
const btn = (cls, small, text, fn) => { const b = document.createElement('button'); b.className = cls; if (small) { const s = document.createElement('small'); s.textContent = small; b.append(s); } b.append(text); b.onclick = fn; return b; };
async function show(item) { try { store.dispatch({ type: 'show', pres: await resolveItem(item, store), index: item.start ?? 0 }); } catch (e) { say(e.message); } }
function drawLive() {
  const l = store.live, p = l.pres, s = p?.slides[l.index];
  $('title').textContent = p ? `${p.title} · ${l.index + 1}/${p.slides.length}` : 'Nada en pantalla';
  $('now').textContent = s ? (s.media ? `[${s.label}]` : s.text) : '';
  $('now').classList.toggle('off', l.black || l.clear || l.logo.on);
  $('black').classList.toggle('on', l.black); $('clear').classList.toggle('on', l.clear); $('logo').classList.toggle('on', l.logo.on);
  $('goAlert').classList.toggle('on', l.alert.on); $('goAlert').textContent = l.alert.on ? 'Quitar' : 'Mostrar';
  const box = $('slides'), slides = p?.slides ?? null;
  if (box._slides !== slides) { // solo se reconstruye la lista cuando cambia la presentación
    box._slides = slides; box._active = null;
    box.replaceChildren(...(slides ?? []).map((x, i) => btn('item', `${i + 1}${x.label ? ' · ' + x.label : ''}`, x.media ? '' : x.text, () => store.dispatch({ type: 'goto', index: i }))));
  }
  const cur = slides ? box.children[l.index] ?? null : null;
  if (box._active !== cur) { box._active?.classList.remove('active'); cur?.classList.add('active'); box._active = cur; cur?.scrollIntoView({ block: 'nearest' }); }
}
function drawDb() {
  $('sched').replaceChildren(...store.db.schedule.items.map(it => { const info = itemInfo(it, store.db); return btn('item' + (store.live.pres?.itemId === it.id ? ' active' : ''), info.sub, `${info.icon} ${info.title}`, () => show(it)); }));
  const q = norm($('q').value).trim();
  $('songs').replaceChildren(...store.db.songs.filter(s => !q || norm(s.title + ' ' + s.text).includes(q)).slice(0, 30)
    .map(s => btn('item', s.author, s.title, () => show({ type: 'song', songId: s.id }))));
}
$('prev').onclick = () => store.dispatch({ type: 'prev' });
$('next').onclick = () => store.dispatch({ type: 'next' });
$('black').onclick = () => store.dispatch({ type: 'black' });
$('clear').onclick = () => store.dispatch({ type: 'clear' });
$('close').onclick = () => store.dispatch({ type: 'close' });
$('logo').onclick = () => store.dispatch({ type: 'logo', src: store.db.settings.logoSrc, text: store.db.settings.churchName });
const goRef = async () => {
  try {
    const bible = await store.loadBible();
    const ref = parseReference($('ref').value, bible);
    if (!ref) return say('No entendí esa cita. Ejemplo: Juan 3:16');
    store.dispatch({ type: 'show', pres: bibleToPresentation(bible, ref, store.db), index: 0 });
  } catch (e) { say(e.message); }
};
$('goRef').onclick = goRef; $('ref').onkeydown = (e) => { if (e.key === 'Enter') goRef(); };
const goAlert = () => {
  if (store.live.alert.on) return store.dispatch({ type: 'alert', value: false });
  const text = $('alert').value.trim(); if (!text) return say('Escribe el mensaje');
  store.dispatch({ type: 'alert', text, value: true });
};
$('goAlert').onclick = goAlert; $('alert').onkeydown = (e) => { if (e.key === 'Enter') goAlert(); };
$('q').oninput = drawDb;
let onAir = null;
store.on((what) => { if (what === 'live') { drawLive(); const id = store.live.pres?.itemId ?? null; if (id !== onAir) { onAir = id; drawDb(); } } else if (what === 'db') drawDb(); else if (what === 'reload') setTimeout(() => location.reload(), 1500); else if (what === 'online') say(store.online ? 'Conectado' : 'Sin conexión, reintentando…'); });
drawLive(); drawDb();
</script>
</body>
</html>
